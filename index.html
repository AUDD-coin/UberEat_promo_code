<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };

    <script defer src="/_vercel/insights/script.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f6f6f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            max-width: 480px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
        }
        .logo {
            font-size: 28px;
            font-weight: 700;
            color: #000000;
            margin-bottom: 25px;
            letter-spacing: -0.5px;
            /*Logo 左移*/
            text-align: left;
        }
        .badge {
            background-color: #000000;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 25px;
        }
        .title {
            font-size: 24px;
            font-weight: 700;
            color: #000000;
            line-height: 1.4;
            margin-bottom: 20px;
        }
        .content-card {
            background-color: #fcfcfc;
            border-left: 4px solid #000000;
            border-radius: 4px;
            padding: 20px;
            text-align: left;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .content-text {
            font-size: 16px;
            color: #333333;
            line-height: 1.6;
        }
        .promo-code {
            font-weight: 700;
            color: #000000;
            background-color: #f0f0f0;
            padding: 2px 6px;
            border-radius: 4px;
            word-break: break-all;
        }
        .btn-primary {
            display: block;
            background-color: #000000;
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 15px;
            transition: background-color 0.2s;
        }
        .btn-primary:hover {
            background-color: #333333;
        }
        .btn-secondary {
            display: inline-block;
            background-color: transparent;
            border: none;
            color: #555555;
            font-size: 14px;
            text-decoration: underline;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .btn-secondary:hover {
            color: #000000;
        }
        .share-hint {
            font-size: 14px;
            color: #666666;
            margin-bottom: 12px;
            display: block;
        }
        /* 綠色 LINE 分享按鈕 */
        .btn-line {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #06C755; /* LINE 官方品牌綠色 */
            color: #ffffff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            padding: 12px;
            border-radius: 8px;
            transition: background-color 0.2s;
            box-shadow: 0 2px 6px rgba(6, 199, 85, 0.2);
        }
        .btn-line:hover {
            background-color: #05b34c;
        }
        /* 新增的 Uber 優惠碼按鈕樣式 */
        .btn-uber-new {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1f1f1f; /* Uber 質感的深黑色 */
            color: #ffffff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            padding: 12px;
            border-radius: 8px;
            margin-top: 16px; /* 與上方 LINE 按鈕保持間距 */
            transition: background-color 0.2s;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }
        .btn-uber-new:hover {
            background-color: #000000; /* 滑鼠懸停時變成全黑 */
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">Uber Eats</div>
    
    <div class="badge">專屬好友推薦優惠</div>
    
    <h2 class="title">肚子餓了嗎？<br>首單現折 40% 優惠</h2>
    
    <div class="content-card">
        <p class="content-text">
            嘿！首次使用 Uber Eats 優食訂餐時，消費滿 $150 即可享 <b>40% 折扣優惠</b> (最高折抵 $60)。須遵守相關條款。在結帳時使用我的代碼：<span class="promo-code" id="codeText">eats-kw9ok9</span>
        </p>
    </div>
    
    <a href="https://ubereats.com/feed?promoCode=eats-kw9ok9" target="_blank" class="btn-primary">立即領取 Uber Eats 優惠</a>
    
    <button class="btn-secondary" onclick="copyCode()">[ 複製優惠代碼 ]</button>
    
    <hr style="border: 0; border-top: 1px solid #eeeeee; margin: 15px 0 20px 0;">
    
    <span class="share-hint">分享給身邊想省錢的朋友</span>
    <a href="https://line.me/R/msg/text/?肚子餓了嗎？用我的代碼「eats-kw9ok9」首單滿150享40%折扣！ https://ubereats.com/feed?promoCode=eats-kw9ok9" target="_blank" class="btn-line">
        透過 LINE 轉寄
    </a>
    <a href="https://uber-promo-code.vercel.app/" target="_blank" class="btn-uber-new">
            立即領取 Uber 優惠碼
    </a>
</div>

<script>
    function copyCode() {
        const code = document.getElementById('codeText').innerText;
        navigator.clipboard.writeText(code).then(() => {
            alert('優惠代碼已複製：' + code);
        }).catch(err => {
            alert('複製失敗，請手動複製代碼');
        });
    }
</script>

</body>
</html>
